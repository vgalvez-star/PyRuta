name: Validar banco de preguntas

on:
  push:
    paths: ["banco-preguntas/**", "tools/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar el validador
        run: python tools/validar_banco.py
